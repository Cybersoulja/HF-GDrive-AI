<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 2rem;
      color: #ffd700;
      font-size: 2rem;
    }
    .card {
      background: #1a1f3a;
      border: 1px solid #2a3f5f;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .upload-area {
      border: 2px dashed #ffd700;
      border-radius: 8px;
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255, 215, 0, 0.05);
    }
    .upload-area:hover {
      background: rgba(255, 215, 0, 0.1);
      border-color: #ffed4e;
    }
    .upload-area.dragover {
      background: rgba(255, 215, 0, 0.2);
      border-color: #ffed4e;
    }
    input[type="file"] { display: none; }
    button {
      background: #ffd700;
      color: #0a0e27;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 1rem;
    }
    button:hover {
      background: #ffed4e;
      transform: translateY(-2px);
    }
    .file-list {
      list-style: none;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #2a3f5f;
      background: rgba(255, 215, 0, 0.02);
    }
    .file-item:last-child { border-bottom: none; }
    .file-info {
      flex: 1;
    }
    .file-name {
      color: #ffd700;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .file-size {
      color: #888;
      font-size: 0.85rem;
    }
    .file-actions button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      margin: 0 0.25rem;
      background: #2a3f5f;
      color: #ffd700;
    }
    .status {
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }
    .status.error { background: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 File Server</h1>
    
    <div id="status" class="status"></div>

    <div class="card">
      <h2 style="margin-bottom: 1.5rem;">Upload Files</h2>
      <div class="upload-area" id="uploadArea">
        <p style="font-size: 3rem; margin-bottom: 0.5rem;">📤</p>
        <p>Drag and drop files here or click to browse</p>
        <input type="file" id="fileInput" multiple>
        <button onclick="document.getElementById('fileInput').click()">Select Files</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 1.5rem;">Files</h2>
      <ul class="file-list" id="fileList">
        <li class="file-item"><p>Loading...</p></li>
      </ul>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const statusEl = document.getElementById('status');

    function showStatus(message, type = 'success') {
      statusEl.textContent = message;
      statusEl.className = `status show ${type}`;
      setTimeout(() => statusEl.classList.remove('show'), 4000);
    }

    function loadFiles() {
      fetch('/api/files/')
        .then(r => r.json())
        .then(data => {
          fileList.innerHTML = data.files.length ? data.files.map(f => `
            <li class="file-item">
              <div class="file-info">
                <div class="file-name">${f.isDirectory ? '📁 ' : '📄 '}${f.name}</div>
                <div class="file-size">${(f.size / 1024).toFixed(2)} KB</div>
              </div>
              <div class="file-actions">
                ${!f.isDirectory ? `<button onclick="deleteFile('${f.name}')">Delete</button>` : ''}
              </div>
            </li>
          `).join('') : '<li class="file-item"><p>No files yet</p></li>';
        });
    }

    function deleteFile(filename) {
      if (!confirm(`Delete ${filename}?`)) return;
      fetch(`/api/files/${filename}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(() => {
          showStatus('File deleted');
          loadFiles();
        })
        .catch(e => showStatus(e.message, 'error'));
    }

    uploadArea.addEventListener('dragover', e => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));

    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      uploadFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', e => uploadFiles(e.target.files));

    function uploadFiles(files) {
      Array.from(files).forEach(file => {
        const formData = new FormData();
        formData.append('file', file);
        fetch('/api/upload', { method: 'POST', body: formData })
          .then(r => r.json())
          .then(data => {
            showStatus(`Uploaded: ${data.filename}`);
            loadFiles();
          })
          .catch(e => showStatus(e.message, 'error'));
      });
    }

    loadFiles();
  </script>
</body>
</html>
